name: cron-daily

on:
  schedule:
    # 每天 UTC 01:00 = 北京 09:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch contests
        run: python cron/fetch_contests.py
      - name: Generate projects (optional, needs secrets)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python cron/generate_projects.py
      - name: Apply overdue penalties
        env:
          SUPABASE_URL: https://qgqmxxcdzjvljckewvhd.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/apply_penalties" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json"
          echo "Penalties applied"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/competitions.json || true
          git add cron/generated-projects.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(cron): sync contests $(date -u +%Y-%m-%d)"
            git push
          fi
