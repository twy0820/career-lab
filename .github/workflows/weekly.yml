name: weekly-mocks

on:
  schedule:
    # 每周一 UTC 01:00 = 北京周一 09:00
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate weekly mocks
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python cron/generate_mocks.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/mock-library.json || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(weekly): add mocks $(date -u +%Y-%m-%d)"
            git push
          fi
